<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>College Admission Portal</title>

</head>

<body>

<h1 id="top">
College Admission Portal
</h1>

<hr>

<form
action="success.html"
method="POST">

<!-- Fieldset -->

<fieldset>

<legend>

Student Information

</legend>

<!-- Label -->

<label for="name">

Full Name

</label>

<br>

<input
type="text"
id="name">

<br><br>

<label for="email">

Email

</label>

<br>

<input
type="email"
id="email">

<br><br>

<label for="mobile">

Mobile Number

</label>

<br>

<input
type="tel"
id="mobile">

<br><br>

<label for="city">

City

</label>

<br>

<input
list="cities"
id="city">

<datalist id="cities">

<option value="Ahmedabad">

<option value="Surat">

<option value="Vadodara">

<option value="Rajkot">

</datalist>

<br><br>

<label>

Address

</label>

<br>

<textarea
rows="5"
cols="40">

</textarea>

</fieldset>

<br>

<!-- Course Selection -->

<fieldset>

<legend>

Course Selection

</legend>

<label>

Choose Course

</label>

<br>

<select>

<optgroup label="Frontend">

<option>HTML</option>

<option>CSS</option>

<option>JavaScript</option>

</optgroup>

<optgroup label="Backend">

<option>Java</option>

<option>Spring Boot</option>

<option>Python</option>

</optgroup>

</select>

</fieldset>

<br>

<!-- Skills -->

<fieldset>

<legend>

Skills

</legend>

HTML
<input type="checkbox">

CSS
<input type="checkbox">

JavaScript
<input type="checkbox">

Java
<input type="checkbox">

</fieldset>

<br>

<!-- Output -->

<label>

Application Fee

</label>

<br>

<output>

₹500

</output>

<br><br>

<input
type="submit"
value="Apply Now">

<input
type="reset"
value="Reset Form">

</form>

<hr>

<h2>
Contact
</h2>

<address>

GLS University

<br>

Ahmedabad

<br>

Gujarat

</address>

<hr>

<a href="#top">

Go To Top

</a>

<hr>

<footer>

<p>

&copy; 2026 College Admission Portal

</p>

</footer>

</body>

</html>
