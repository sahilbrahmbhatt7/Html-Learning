<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Employee Management System</title>

</head>

<body>

<h1 id="top">
Employee Management System

Registration Form

<h2 id="registration">
Employee Registration Form
</h2>

<form
action="success.html"
method="POST">

<!-- Hidden Field -->

<input
type="hidden"
value="EMP001">

<!-- Search -->

<label>
Search Employee
</label>

<br>

<input
type="search"
placeholder="Search">

<br><br>

<!-- Name -->

<label>
Full Name
</label>

<br>

<input
type="text"
placeholder="Enter Name">

<br><br>

<!-- Password -->

<label>
Password
</label>

<br>

<input
type="password"
placeholder="Password">

<br><br>

<!-- Email -->

<label>
Email
</label>

<br>

<input
type="email"
placeholder="Email">

<br><br>

<!-- Number -->

<label>
Age
</label>

<br>

<input
type="number">

<br><br>

<!-- Phone -->

<label>
Phone
</label>

<br>

<input
type="tel">

<br><br>

<!-- URL -->

<label>
Portfolio URL
</label>

<br>

<input
type="url">

<br><br>

<!-- Date -->

<label>
Joining Date
</label>

<br>

<input
type="date">

<br><br>

<!-- Time -->

<label>
Shift Time
</label>

<br>

<input
type="time">

<br><br>

<!-- Datetime -->

<label>
Interview Date & Time
</label>

<br>

<input
type="datetime-local">

<br><br>

<!-- Month -->

<label>
Joining Month
</label>

<br>

<input
type="month">

<br><br>

<!-- Week -->

<label>
Training Week
</label>

<br>

<input
type="week">

<br><br>

<!-- Color -->

<label>
Favorite Color
</label>

<br>

<input
type="color">

<br><br>

<!-- Range -->

<label>
Experience Level
</label>

<br>

<input
type="range"
min="0"
max="10">

<br><br>

<!-- File -->

<label>
Upload Resume
</label>

<br>

<input
type="file">

<br><br>

<!-- Radio -->

<h3>
Gender
</h3>

Male

<input
type="radio"
name="gender">

Female

<input
type="radio"
name="gender">

<br><br>

<!-- Checkbox -->

<h3>
Skills
</h3>

HTML
<input
type="checkbox">

CSS
<input
type="checkbox">

JavaScript
<input
type="checkbox">

Java
<input
type="checkbox">

<br><br>

<!-- Buttons -->

<input
type="submit"
value="Register">

<input
type="reset"
value="Clear">

<button>
Custom Button
</button>

</form>
