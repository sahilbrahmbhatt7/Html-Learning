<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Job Application Portal</title>

</head>

<body>

<h1 id="top">
Job Application Portal
</h1>

<hr>

<form
action="success.html"
method="POST"
autocomplete="on">

<fieldset>

<legend>

Personal Information

</legend>

<label for="name">

Full Name

</label>

<br>

<input
type="text"
id="name"
placeholder="Enter Full Name"
required
autofocus
minlength="3"
maxlength="30">

<br><br>

<label for="email">

Email

</label>

<br>

<input
type="email"
id="email"
placeholder="Enter Email"
required>

<br><br>

<label for="mobile">

Mobile Number

</label>

<br>

<input
type="text"
id="mobile"
placeholder="9876543210"
pattern="[0-9]{10}"
required>

<br><br>

<label for="age">

Age

</label>

<br>

<input
type="number"
id="age"
min="18"
max="60"
required>

</fieldset>

<br>

<fieldset>

<legend>

Job Information

</legend>

<label>

Application ID

</label>

<br>

<input
type="text"
value="JOB2026"
readonly>

<br><br>

<label>

Current Status

</label>

<br>

<input
type="text"
value="Applications Open"
disabled>

<br><br>

<label>

Experience Level

</label>

<br>

<input
type="range"
min="0"
max="10">

</fieldset>

<br>

<fieldset>

<legend>

Skills

</legend>

HTML
<input type="checkbox">

CSS
<input type="checkbox">

JavaScript
<input type="checkbox">

Java
<input type="checkbox">

</fieldset>

<br>

<fieldset>

<legend>

Documents

</legend>

<label>

Upload Resume

</label>

<br>

<input
type="file"
multiple
required>

</fieldset>

<br>

<input
type="submit"
value="Apply Now">

<input
type="reset"
value="Reset Form">

</form>

<hr>

<h2>
Contact
</h2>

<address>

Ahmedabad

<br>

Gujarat

<br>

India

</address>

<hr>

<a href="#top">

Go To Top

</a>

<hr>

<footer>

<p>

&copy; 2026 Job Application Portal

</p>

</footer>

</body>

</html>
